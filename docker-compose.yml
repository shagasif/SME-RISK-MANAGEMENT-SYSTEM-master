services:
  postgres:
    image: postgres:16-alpine
    container_name: sme_financial_intelligence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sme_financial_intelligence_dev
    ports:
      - "5432:5432"
    volumes:
      - sme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sme_financial_intelligence_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sme_postgres_data:
    driver: local
